[project]
name = "pii-scrub"
version = "0.1.0"
license = "MIT"
description = "Replace personal data in Russian text with stable labels: CLI and library"
requires-python = ">=3.13,<3.14"
dependencies = [
  "natasha==1.6.0",
  # natasha тянет pymorphy2, он на Python 3.13 импортирует pkg_resources; в setuptools 81+ его нет.
  "setuptools<81",
  "phonenumbers==9.0.41",
  "python-stdnum==2.2",
]

[project.scripts]
scrub = "pii_scrub.cli:main"

[dependency-groups]
dev = [
  "faker>=40.43.0",
  "num2words>=0.5.14",
  "pytest",
  "pytest-recording",
  "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pii_scrub"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "integration: нужна БД или очередь",
  "live: платный или живой внешний вызов",
]
addopts = "-m 'not live'"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = [
  "E", "F", "W", # pycodestyle, pyflakes
  "I", # порядок импортов
  "UP", # современный синтаксис
  "B", # вероятные ошибки
  "ANN", # type hints везде
  "BLE", # except Exception
  "S", # bandit: опасные вызовы, секреты в коде, subprocess, pickle
  "C901", # сложность функции
  "PLR0913", # слишком много аргументов
  "PLR0915", # слишком много операторов
  "RUF",
]
# Русский текст в строках и комментариях: латинские двойники кириллицы не ошибка.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN", "PLR0915", "S101", "S105", "S106", "S311", "E501"]
"tests/gen/**" = ["C901"]
"**/test_*.py" = ["ANN", "PLR0915", "S101", "S105", "S106", "S311", "E501"]
