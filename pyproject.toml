[project]
name = "pii-scrub"
version = "0.2.0"
license = "MIT"
description = "Replace personal data in Russian text with stable labels: CLI and library"
requires-python = ">=3.13,<3.14"
dependencies = [
  "natasha==1.6.0",
  # natasha pulls in pymorphy2, which imports pkg_resources on Python 3.13; setuptools 81+ no longer has it.
  "setuptools<81",
  "phonenumbers==9.0.41",
  "python-stdnum==2.2",
]

[project.scripts]
scrub = "pii_scrub.cli:main"

[dependency-groups]
dev = [
  "faker>=40.43.0",
  "num2words>=0.5.14",
  "pytest",
  "pytest-recording",
  "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pii_scrub"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "integration: needs a database or a queue",
  "live: a paid or live external call",
]
addopts = "-m 'not live'"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = [
  "E", "F", "W", # pycodestyle, pyflakes
  "I", # import order
  "UP", # modern syntax
  "B", # likely bugs
  "ANN", # type hints everywhere
  "BLE", # except Exception
  "S", # bandit: dangerous calls, secrets in code, subprocess, pickle
  "C901", # function complexity
  "PLR0913", # too many arguments
  "PLR0915", # too many statements
  "RUF",
]
# Russian text in strings and comments: Latin look-alikes of Cyrillic letters are not an error.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN", "PLR0915", "S101", "S105", "S106", "S311", "E501"]
"tests/gen/**" = ["C901"]
"**/test_*.py" = ["ANN", "PLR0915", "S101", "S105", "S106", "S311", "E501"]
